[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "snipbox"
version = "0.1.0"
description = "Zero-dependency CLI snippet & note manager: save, tag, search and copy from your terminal."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
dependencies = []

[project.scripts]
snipbox = "snipbox.cli:main"

[tool.setuptools]
packages = ["snipbox"]
